name: Go CI
on:
  push:
    branches: [Alpha0.1]
  pull_request:
    branches: [Alpha0.1]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - name: Resolve Go module dependencies
        run: go mod tidy
      - name: Validate installer scripts
        run: bash -n scripts/install-termux.sh scripts/build-android-armv7.sh
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android NDK r27c
        run: sdkmanager "ndk;27.2.12479018"
      - name: Cross-build Termux ARMv7 binary
        run: bash scripts/build-android-armv7.sh
