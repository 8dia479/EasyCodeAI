name: Go CI
on:
  push:
    branches: [Alpha0.1]
  pull_request:
    branches: [Alpha0.1]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
